<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login-style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
    </style>
    <title>Pay++</title>
</head>
<body>

    <div class="login-form">
        <form id="login-form">
            <!--? User Inputs-->
            <div id="welcome-msg">
                <p>Welcome to Pay++</p>
                <h1>Login</h1><br><br>
            </div>
            <label class="user-inputs" for="user-email" >School Email Address</label>
            <input type="email" name="user-email" id="user-email" placeholder="@wmsu.edu.ph"><br/>
            
            <label class="user-inputs" for="user-password">Password</label>
                 <div style="position:relative; width:100%;">
                <input type="password" name="user-password" 
                       id="user-password" placeholder="password"
                      style="width:100%; 
                          padding-right:44px;
                          box-sizing:border-box;
                          display:block;">
                <button type="button" id="togglePassword"
                        style="position:absolute;
                               right:12px;
                               top:50%;
                               transform:translateY(-50%);
                               background:none;
                               border:none;
                               cursor:pointer;
                               color:#2e7d52;
                               font-size:20px;
                               display:flex;
                               align-items:center;
                               padding:0;">
                    <i class='bx bx-hide'></i>
                </button>
            </div>
            <div id="forgot">
                <a href="#" id="forgot-password-link">Forgot Password?</a><br>
            </div>
            
            <input id="submit-btn" type="submit" value="Sign In">
            <div style="text-align: center; margin-top: 16px; font-size: 12px;">
                Don't have an account? <a href="signup.html" style="color: var(--first-color); text-decoration: none; font-weight: 600;">Sign Up</a>
            </div>
        </form>
    </div>

    <div id="forgot-password-overlay" class="fp-overlay" aria-hidden="true">
        <div class="fp-modal" role="dialog" aria-modal="true" aria-labelledby="fp-title">
            <button type="button" id="fp-close-btn" class="fp-close" aria-label="Close forgot password modal">&times;</button>

            <div id="forgot-step-1" class="fp-step">
                <h2 id="fp-title">Forgot Password</h2>
                <p class="fp-subtitle">Enter your registered email and we'll send you a reset link.</p>

                <label for="reset-email">Email</label>
                <input type="email" id="reset-email" name="reset-email" placeholder="Enter your email" required>
                <p id="email-error" style="color: red; font-size: 0.85rem; display: none; margin-top: 4px;">Please enter a valid email address.</p>

                <button type="button" id="send-reset-btn" class="fp-primary-btn">Send Link</button>
            </div>

            <div id="forgot-step-2" class="fp-step fp-hidden" aria-hidden="true" style="display:none;">
                <h2>Reset Link Sent!</h2>
                <p class="fp-subtitle">A password reset link has been sent to your email. Please check your inbox.</p>
                <button type="button" id="fp-back-btn" class="fp-primary-btn">Back to Login</button>
            </div>
        </div>
    </div>

    <button id="reset-demo-data-btn" type="button" style="display: none;" aria-hidden="true" tabindex="-1">Reset Demo Data</button>

    <script src="assets/scripts/sample-accounts.js"></script>
    <script src="assets/scripts/auth.js"></script>
    <script src="assets/scripts/script.js"></script>
    <script src="assets/scripts/login.js"></script>

</body>
</html>
