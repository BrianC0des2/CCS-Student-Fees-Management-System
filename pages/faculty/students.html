<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>CCS PAY++ - My Students</title>
    <link rel="stylesheet" href="../../styles/sidebar.css">
    <link rel="stylesheet" 
          href="../../styles/faculty-styles/faculty-dashboard.css">
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" 
          rel="stylesheet">
    <link rel="stylesheet" href="../../styles/settings.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Member card styles */
        .member-card {
            background: var(--faculty-card);
            border: 1px solid var(--faculty-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .member-card:hover {
            border-color: var(--faculty-green);
        }
        .member-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .member-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--faculty-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .member-info {
            flex: 1;
            min-width: 0;
        }
        .member-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--faculty-text);
            margin-bottom: 4px;
        }
        .member-meta {
            font-size: 12px;
            color: var(--faculty-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 3px;
        }
        .member-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .member-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            color: var(--faculty-muted);
        }
        .icon-btn:hover {
            background: #fee2e2;
            color: var(--faculty-red);
        }
        /* Form box styles */
        .form-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .form-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .form-box-title {
            font-weight: 600;
            color: #14532d;
            font-size: 14px;
        }
        .form-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--faculty-muted);
            line-height: 1;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--faculty-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--faculty-border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: white;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--faculty-green);
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }
        /* Section filter tabs */
        .section-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .section-tab {
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid var(--faculty-border);
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: var(--faculty-muted);
        }
        .section-tab.active {
            background: var(--faculty-green);
            color: white;
            border-color: var(--faculty-green);
        }
        /* Confirm remove box */
        .confirm-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: var(--faculty-red);
        }
        .confirm-box-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--faculty-text);
        }
        .section-sub {
            font-size: 13px;
            color: var(--faculty-muted);
            margin-top: 2px;
        }
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }
        .search-wrap input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border: 1px solid var(--faculty-border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: white;
            box-sizing: border-box;
        }
        .search-wrap input:focus {
            border-color: var(--faculty-green);
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--faculty-muted);
            pointer-events: none;
        }
        .filters-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .empty-state {
            text-align: center;
            color: var(--faculty-muted);
            padding: 40px;
            font-size: 14px;
        }
        .student-count-badge {
            background: #e7f7ed;
            color: var(--faculty-green);
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        /* ─── Responsive Design ─────────────────────────────────────────────── */
        @media (max-width: 1024px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            #pageContent {
                display: flex;
                flex-direction: column;
            }
            #pageContent > .section-header {
                order: 1;
            }
            #pageContent > #addStudentForm {
                order: 2;
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                left: auto;
                transform: none;
                margin-top: 10px;
            }
            #pageContent > .summary-cards {
                order: 3;
            }
            #pageContent > .faculty-search-filter {
                order: 4;
            }
            #pageContent > .section-tabs {
                order: 5;
            }
            #pageContent > #studentList {
                order: 6;
            }
            .section-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .bulk-action-btn {
                width: 100%;
            }
            .member-row {
                flex-direction: column;
                gap: 8px;
            }
            .member-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-actions {
                flex-direction: column-reverse;
                gap: 8px;
            }
            .form-actions button {
                width: 100%;
            }
            .confirm-box {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
            .confirm-box-actions {
                width: 100%;
                justify-content: flex-start;
            }
            .section-tabs {
                gap: 6px;
            }
            .section-tab {
                padding: 6px 12px;
                font-size: 11px;
            }
            .search-wrap {
                min-width: 0;
            }
            .filters-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .search-wrap input {
                width: 100%;
            }
        }
        @media (max-width: 375px) {
            #pageContent {
                display: flex;
                flex-direction: column;
            }
            #pageContent > #addStudentForm {
                order: 2;
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                left: auto;
                transform: none;
                margin-top: 10px;
            }
            .form-box {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <section class="home-section faculty-home">
        <div class="home-content">
            <div class="home-heading">
                <i class='bx bx-menu'></i>
                <span class="text">My Students</span>
            </div>
            <div class="topbar-right">
                <span class="ay-badge"></span>
                <div class="notif-bell" aria-label="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notif-badge">3</span>
                </div>
            </div>
        </div>

        <!-- Page content -->
        <div id="pageContent" style="padding: 0 4px;">

            <div class="section-header">
                <div>
                    <div class="section-title">My Students</div>
                    <div class="section-sub">
                        Manage your class roster — CS 1-A and CS 1-B
                    </div>
                </div>
            </div>

            <div class="summary-cards" style="margin-bottom:16px;">
                <div class="card">
                    <i class='bx bx-group'></i>
                    <h3>Total Students</h3>
                    <p id="countTotal">0</p>
                </div>
                <div class="card">
                    <i class='bx bx-book'></i>
                    <h3>CS 1-A</h3>
                    <p id="countCS1A">0</p>
                </div>
                <div class="card">
                    <i class='bx bx-book'></i>
                    <h3>CS 1-B</h3>
                    <p id="countCS1B">0</p>
                </div>
            </div>

            <!-- Search and section filter -->
            <div class="faculty-search-filter" 
                 style="margin-bottom:16px;">
                <input type="text" 
                       id="studentSearchInput"
                       placeholder="Search by name or student no.">
                <button id="studentSearchBtn">Search</button>
                <div class="filters-container">
                    <button id="studentFiltersBtn" 
                            class="filters-btn" type="button">
                        <i class='bx bx-sort-alt-2'></i>
                        Filters
                    </button>
                    <div id="studentFiltersPopover" 
                         class="filters-popover">
                        <div class="filters-grid">
                            <div class="filter-group">
                                <label>Year Level</label>
                                <select id="studentFilterYear">
                                    <option value="">All</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Course</label>
                                <select id="studentFilterCourse">
                                    <option value="">All</option>
                                    <option value="BS Computer Science">BS Computer Science</option>
                                    <option value="BS Information Technology">BS Information Technology</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Section</label>
                                <select id="studentFilterSection">
                                    <option value="">All</option>
                                    <option value="CS 1-A">CS 1-A</option>
                                    <option value="CS 1-B">CS 1-B</option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button id="studentResetFilters" 
                                    class="reset-btn" type="button">Reset</button>
                            <button id="studentApplyFilters" 
                                    class="apply-btn" type="button">Apply</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-tabs">
                <button class="section-tab active" 
                    data-section="all"
                    id="tabAll">All (0)</button>
                <button class="section-tab" 
                    data-section="CS 1-A"
                    id="tabCS1A">CS 1-A (0)</button>
                <button class="section-tab" 
                    data-section="CS 1-B"
                    id="tabCS1B">CS 1-B (0)</button>
            </div>

            <!-- Student list -->
            <div id="studentList"></div>

        </div>
    </section>

    <script src="../../assets/scripts/sample-accounts.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/sidebar-template.js"></script>
    <script src="../../assets/scripts/script.js"></script>
    <script src="../../assets/scripts/settings.js"></script>
    <script src="../../assets/scripts/faculty/faculty-students-sections.js"></script>
</body>
</html>
