<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>CCS PAY++</title>
    <link rel="stylesheet" href="../../styles/sidebar.css">
    <link rel="stylesheet" href="../../styles/organization-styles/organization-dashboard.css">
    <link rel="stylesheet" href="../../styles/organization-styles/org-payment-history.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../../styles/settings.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="sidebar-container"></div>

    <section class="home-section">
        <div class="home-content">
            <div>
                <i class='bx bx-menu'></i>
                <span class="text">Payment History</span>
            </div>
            <div class="topbar-right">
                <span class="ay-badge"></span>
                <div class="notif-bell" aria-label="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notif-badge">3</span>
                </div>
            </div>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="search-filter">
            <input type="text" placeholder="Search by name or student no." id="searchInput">
            <button id="searchBtn">Search</button>
            <div class="filters-container">
                <button id="filtersBtn" class="filters-btn">
                    <i class='bx bx-sort-alt-2'></i>
                     Filters
                </button>
                <div id="filtersPopover" class="filters-popover">
                    <div class="filters-grid">
                        <div class="filter-group">
                            <label>Year Level</label>
                            <select id="yearLevel">
                                <option value="">All</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Course</label>
                            <select id="course">
                                <option value="">All</option>
                                <option value="BSCS">BS Computer Science</option>
                                <option value="BSIT">BS Information Technology</option>
                                <option value="ACT-AD">ACT AppDev</option>
                                <option value="ACT-NET">ACT Networking</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Section</label>
                            <select id="section">
                                <option value="">All</option>
                                <option value="CS 1-A">CS 1-A</option>
                                <option value="CS 1-B">CS 1-B</option>
                                <option value="CS 2-A">CS 2-A</option>
                                <option value="CS 2-B">CS 2-B</option>
                                <option value="CS 3-A">CS 3-A</option>
                                <option value="CS 3-B">CS 3-B</option>
                                <option value="CS 4-A">CS 4-A</option>
                                <option value="CS 4-B">CS 4-B</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>School Year</label>
                            <select id="schoolYear">
                                <option value="">All</option>
                                <option value="2025-2026">2025-2026</option>
                                <option value="2024-2025">2024-2025</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Semester</label>
                            <select id="semester">
                                <option value="">All</option>
                                <option value="1st">1st Semester</option>
                                <option value="2nd">2nd Semester</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button id="resetFilters" class="reset-btn">Reset</button>
                        <button id="applyFilters" class="apply-btn">Apply</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTIVE FILTERS -->
        <div id="activeFilters" class="active-filters"></div>

        <!-- STUDENT RECORDS -->
        <div class="members-table">
            <div class="table-header">
                <h2>Student Records</h2>
                <button class="export-btn">Export to Excel</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student No.</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Year & Section</th>
                            <th>School Year</th>
                            <th>Semester</th>
                            <th>Fee Name</th>
                            <th>Amount</th>
                            <th>Payment Method</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orgPaymentHistoryBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="../../assets/scripts/settings.js"></script>
    <script src="../../assets/scripts/sample-accounts.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/sidebar-template.js"></script>
    <script src="../../assets/scripts/script.js"></script>
    <script src="../../assets/scripts/organization/org-payment-history.js"></script>

</body>
</html>
