<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <title> CCS PAY++</title>
        <link rel="stylesheet" href="../../styles/sidebar.css">
        <link rel="stylesheet" href="../../styles/organization-styles/organization-dashboard.css">
        <!-- Boxiocns CDN Link -->
        <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="../../styles/settings.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .table-container {
                max-height: 500px;
                overflow-y: auto;
            }
            .members-table thead th {
                position: sticky;
                top: 0;
                z-index: 10;
                background: #f5f5f5;
            }
            .apply-btn {
                background: #2e7d52 !important;
                color: #ffffff !important;
            }
            .reset-btn {
                background: #f5f5f5;
                color: #1a2420;
                border: 1px solid #d4e2d8;
            }
            .filters-btn {
                background: #2e7d52 !important;
                color: #ffffff !important;
                border: 1px solid #2e7d52 !important;
            }
            .filters-btn:hover {
                background: #1a5c3a !important;
            }
            .apply-btn:hover {
                background: #1a5c3a !important;
            }
        </style>
    </head>
    <body>
        <div id="sidebar-container"></div>

        <section class="home-section">
            <div class="home-content">
                <div>
                    <i class='bx bx-menu' ></i>
                    <span class="text">Organization Dashboard</span>
                </div>
                <div class="org-header-card">
                    <a href="organization-dashboard.html">
                    <img src="../../assets/images/org-ccs.png" class="org-header-logo" alt="org-logo">
                    <div>
                        <div class="org-header-name">CCS Student Council</div>
                        <div class="org-header-sub" id="orgYearSem"></div>
                        </a>
                    </div>
                </div>
            </div>

        <div class="summary-cards">
            <div class="card">
                <i class='bx bx-money'></i>
                <h3>Total Collected </h3>
                <p>₱6,640</p>
            </div>
            <div class="card">
                <i class='bx bx-time-five'></i>
                <h3>Pending Payments</h3>
                <p>16</p>
            </div>
            <div class="card">
                <i class='bx bx-check-circle'></i>
                <h3>Fully Paid</h3>
                <p>4</p>
            </div>
            <div class="card">
                <i class='bx bx-group'></i>
                <h3>Total Students</h3>
                <p>20</p>
            </div>
        </div>


        <div class="search-filter">
            <input type="text" placeholder="Search by name or student no." id="searchInput">
            <button id="searchBtn">Search</button>
            <div class="filters-container">
                <button id="filtersBtn" class="filters-btn">
                    <i class='bx bx-sort-alt-2'></i>
                    Filters
                </button>
                <div id="filtersPopover" class="filters-popover">
                    <div class="filters-grid">
                        <div class="filter-group">
                            <label>Year Level</label>
                            <select id="yearLevel">
                                <option value="">All</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Course</label>
                            <select id="course">
                                <option value="">All</option>
                                <option value="BSCS">BS Computer Science</option>
                                <option value="BSIT">BS Information Technology</option>
                                <option value="ACT-AD">ACT AppDev</option>
                                <option value="ACT-NET">ACT Networking</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Section</label>
                            <select id="section">
                                <option value="">All</option>
                                <option value="CS 1-A">CS 1-A</option>
                                <option value="CS 1-B">CS 1-B</option>
                                <option value="CS 2-A">CS 2-A</option>
                                <option value="CS 2-B">CS 2-B</option>
                                <option value="CS 3-A">CS 3-A</option>
                                <option value="CS 3-B">CS 3-B</option>
                                <option value="CS 4-A">CS 4-A</option>
                                <option value="CS 4-B">CS 4-B</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Mode of Payment</label>
                            <select id="paymentMethodFilter">
                                <option value="">All</option>
                                <option value="GCash">GCash</option>
                                <option value="PayMaya">PayMaya</option>
                                <option value="Bank Transfer">
                                    Bank Transfer
                                </option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button id="resetFilters" class="reset-btn">Reset</button>
                        <button id="applyFilters" class="apply-btn">Apply</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTIVE FILTERS -->
        <div id="activeFilters" class="active-filters"></div>

    
        <div class="members-table">
            <div class="table-header">
                <h2>Student Records</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student No.</th>
                            <th>Name</th>
                            <th>Year & Section</th>
                            <th>Amount Paid</th>
                            <th>Total Due</th>
                            <th>Status</th>
                            <th>Last Payment</th>
                            <th>Payment Method</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orgStudentRecordsBody"></tbody>
                </table>
            </div>
        </div>

    </section>

    <script src="../../assets/scripts/settings.js"></script>
    <script src="../../assets/scripts/sample-accounts.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/sidebar-template.js"></script>
    <script src="../../assets/scripts/script.js"></script>
    <script>
    (function () {
        const FEES_STORAGE_KEY = 'ccs.organization.fees';
        const PROFILE_OVERRIDES_KEY = 'ccs.auth.accountProfileOverrides';

        function readJson(value, fallback) {
            try {
                const parsed = JSON.parse(value);
                return parsed === null || parsed === undefined ? fallback : parsed;
            } catch (_err) {
                return fallback;
            }
        }

        function defaultFees() {
            return [
                { id: 'fee-default-csc', name: 'CSC Fee', amount: 200, appliesTo: 'all', isActive: true },
                { id: 'fee-default-misc', name: 'Miscellaneous fee', amount: 60, appliesTo: 'all', isActive: true },
                { id: 'fee-default-msa', name: 'MSA Fee', amount: 50, appliesTo: 'Muslim', isActive: true },
                { id: 'fee-default-insurance', name: 'Insurance (Whole Year)', amount: 100, appliesTo: 'all', isActive: true }
            ];
        }

        function normalizeAppliesToValue(appliesTo, specificReligion) {
            const normalized = String(appliesTo || 'all').trim().toLowerCase();
            if (normalized === 'muslim' || normalized === 'muslim/islam') return 'muslim';
            if (normalized === 'catholic' || normalized === 'roman catholic') return 'catholic';
            if (normalized === 'specific') {
                const value = String(specificReligion || '').trim().toLowerCase();
                return value || 'all';
            }
            return normalized || 'all';
        }

        function getSelectedFee() {
            const savedFees = readJson(localStorage.getItem(FEES_STORAGE_KEY), []);
            const fees = Array.isArray(savedFees) && savedFees.length ? savedFees : defaultFees();

            const params = new URLSearchParams(window.location.search);
            const feeIdFromQuery = params.get('feeId');
            const feeIdFromStorage = localStorage.getItem('ccs.organization.selectedFeeId') || localStorage.getItem('ccs.organization.activeFeeId');
            const selectedFeeId = feeIdFromQuery || feeIdFromStorage;

            if (selectedFeeId) {
                const matched = fees.find(function (fee) { return fee.id === selectedFeeId; });
                if (matched) return matched;
            }

            const feeNameFromQuery = params.get('feeName');
            const feeNameFromStorage = localStorage.getItem('ccs.organization.selectedFeeName') || localStorage.getItem('ccs.organization.activeFeeName');
            const selectedFeeName = (feeNameFromQuery || feeNameFromStorage || '').trim().toLowerCase();
            if (selectedFeeName) {
                const matchedByName = fees.find(function (fee) {
                    return String(fee.name || '').trim().toLowerCase() === selectedFeeName;
                });
                if (matchedByName) return matchedByName;
            }

            const selectedFeeRaw = readJson(localStorage.getItem('ccs.organization.selectedFee'), null);
            if (selectedFeeRaw && typeof selectedFeeRaw === 'object') {
                return selectedFeeRaw;
            }

            return fees.find(function (fee) { return fee.isActive !== false; }) || fees[0] || { name: 'Selected Fee', amount: 0, appliesTo: 'all' };
        }

        function parsePeso(value) {
            return Number(String(value || '0').replace(/[^\d.-]/g, '')) || 0;
        }

        function formatPeso(value) {
            return new Intl.NumberFormat('en-PH', {
                style: 'currency',
                currency: 'PHP',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(Number(value) || 0);
        }

        function normalizeReligion(value) {
            return String(value || '').trim().toLowerCase();
        }

        function studentMatchesFee(studentReligion, fee) {
            const appliesTo = normalizeAppliesToValue(fee.appliesTo, fee.specificReligion);
            if (appliesTo === 'all') return true;

            const religion = normalizeReligion(studentReligion);
            if (!religion) return false;

            if (appliesTo === 'muslim') {
                return religion === 'muslim/islam' || religion === 'muslim';
            }
            if (appliesTo === 'catholic') {
                return religion === 'roman catholic' || religion === 'catholic';
            }

            return religion === appliesTo;
        }

        function renderOrgStudentRows() {
            const tbody = document.getElementById('orgStudentRecordsBody');
            if (!tbody) return;

            const selectedFee = getSelectedFee();
            const feeName = String(selectedFee.name || '').toLowerCase();
            const feeAmount = Number(selectedFee.amount) || 0;

            const overrides = readJson(localStorage.getItem(PROFILE_OVERRIDES_KEY), {});
            const students = (window.SAMPLE_ACCOUNTS || []).filter(function (account) {
                return account && account.permissions && account.permissions.studentView;
            }).map(function (account) {
                const override = overrides[account.id] || {};
                return {
                    ...account,
                    religion: typeof override.religion === 'string' ? override.religion : account.religion
                };
            }).filter(function (student) {
                return studentMatchesFee(student.religion, selectedFee);
            });

            const allPayments = window.SAMPLE_PAYMENTS || [];

            tbody.innerHTML = students.map(function (student) {
                const payments = allPayments
                    .filter(function (payment) {
                        if (payment.studentNo !== student.studentId) return false;
                        if (!feeName) return true;
                        return String(payment.desc || '').toLowerCase().includes(feeName);
                    })
                    .sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

                const paidAmount = payments.reduce(function (total, payment) {
                    return total + parsePeso(payment.amount);
                }, 0);

                const dueAmount = Math.max(feeAmount - paidAmount, 0);
                const isPaid = feeAmount > 0 && paidAmount >= feeAmount;
                const latestPayment = payments[0] || null;

                return `
                    <tr>
                        <td>${student.studentId || '-'}</td>
                        <td>${student.name || '-'}</td>
                        <td>${student.year && student.section ? `${student.year} - ${student.section}` : '-'}</td>
                        <td>${formatPeso(paidAmount)}</td>
                        <td>${formatPeso(dueAmount)}</td>
                        <td><span class="status ${isPaid ? 'fully-paid' : 'pending'}">${isPaid ? 'Fully Paid' : 'Pending'}</span></td>
                        <td>${latestPayment ? latestPayment.date : '-'}</td>
                        <td>${latestPayment && latestPayment.method ? latestPayment.method : '-'}</td>
                        <td><button class="action-btn">View Details</button></td>
                    </tr>
                `;
            }).join('');
        }

        renderOrgStudentRows();
    })();

    const filtersBtn = document.getElementById('filtersBtn');
    const filtersPopover = document.getElementById('filtersPopover');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const yearLevelSelect = document.getElementById('yearLevel');
    const courseSelect = document.getElementById('course');
    const sectionSelect = document.getElementById('section');
    const paymentMethodSelect = document.getElementById('paymentMethodFilter');

    const yearLabelMap = {
        '1': '1st Year',
        '2': '2nd Year',
        '3': '3rd Year',
        '4': '4th Year'
    };

    function matchesCourse(yearSection, course) {
        if (!course) return true;
        if (course === 'BSCS') return yearSection.includes('CS ');
        if (course === 'BSIT') return yearSection.includes('IT ');
        return yearSection.includes(course);
    }

    function applyStudentFilters() {
        const searchQuery = searchInput.value.toLowerCase().trim();
        const yearLevel = yearLevelSelect.value;
        const course = courseSelect.value;
        const section = sectionSelect.value;
        const paymentMethod = paymentMethodSelect.value;
        const yearLabel = yearLabelMap[yearLevel] || '';

        document.querySelectorAll('#orgStudentRecordsBody tr').forEach(row => {
            const cells = row.querySelectorAll('td');
            const rowText = row.textContent.toLowerCase();
            const yearSection = cells[2]?.textContent.trim() || '';
            const method = cells[7]?.textContent.trim() || '';

            let show = true;

            if (searchQuery && !rowText.includes(searchQuery)) show = false;
            if (yearLabel && !yearSection.includes(yearLabel)) show = false;
            if (!matchesCourse(yearSection, course)) show = false;
            if (section && !yearSection.includes(section)) show = false;
            if (paymentMethod && method !== paymentMethod) show = false;

            row.style.display = show ? '' : 'none';
        });
    }

    filtersBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        filtersPopover.classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
        if (!filtersBtn.contains(e.target) &&
            !filtersPopover.contains(e.target)) {
            filtersPopover.classList.remove('show');
        }
    });

    document.getElementById('applyFilters').addEventListener('click', function() {
        filtersPopover.classList.remove('show');
        applyStudentFilters();
    });

    document.getElementById('resetFilters').addEventListener('click', function() {
        yearLevelSelect.value = '';
        courseSelect.value = '';
        sectionSelect.value = '';
        paymentMethodSelect.value = '';
        filtersPopover.classList.remove('show');
        applyStudentFilters();
    });

    searchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        applyStudentFilters();
    }, true);

    searchInput.addEventListener('input', function() {
        applyStudentFilters();
    });
    </script>
</body>
</html>
