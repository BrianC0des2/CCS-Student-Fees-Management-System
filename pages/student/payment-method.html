<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <title> CCS PAY++ - Payment Method </title>
        <link rel="stylesheet" href="../../styles/student-styles/payment-process.css">
        <link rel="stylesheet" href="../../styles/sidebar.css">
        <!-- Boxicons CDN Link -->
        <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="../../styles/settings.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <nav class="navbar page-header payment-header">
            <a href="make-payment.html" class="back-arrow"><i class="bx bx-arrow-back"></i></a>
            <div class="nav-title">
                <h2>Make Payment</h2>
                <p>Complete your fee payment securely</p>
            </div>
        </nav>

        <!-- Step Indicator -->
        <div id="payment-process-container" class="step-indicator">
            <div class="vis-container">
                <div class="circle done step-circle"><i class='bx bx-check'></i></div>
                <p class="texts step-label">Select Fees</p>
            </div>
            <div class="line line-done step-line"></div>

            <div class="vis-container">
                <div class="circle c2 step-circle"><p>2</p></div>
                <p class="texts t2 step-label">Payment Method</p>
            </div>

            <div class="line l2 step-line"></div>

            <div class="vis-container">
                <div class="circle c3 step-circle"><p>3</p></div>
                <p class="texts t3 step-label">Confirmation</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="step-one-wrapper payment-body payment-layout payment-content">

            <!-- Payment Method Options -->
            <div class="fee-selection-container fees-panel fee-selection">
                <div style="width:100%">
                    <h3>Choose Payment Method</h3>
                    <div id="paymentAccountsList"></div>
                    <p id="paymentAccountsEmpty" class="summary-empty" style="display:none; margin-top:12px;">
                        No active payment accounts are configured for this organization.
                    </p>

                    <!-- Security badges -->
                    <div class="security-badges">
                        <i class='bx bx-lock-alt'></i>
                        <span>Secure Payment</span>
                        <span class="badge-sep">•</span>
                        <span>256-bit SSL Encrypted</span>
                        <span class="badge-sep">•</span>
                        <span>PCI DSS Compliant</span>
                    </div>
                </div>
            </div>

            <!-- Payment Summary -->
            <div class="payment-summary summary-panel">
                <h3>Payment Summary</h3>
                <div id="method-summary-items"></div>
                <div class="summary-total">
                    <span>Total Amount</span>
                    <span id="method-summary-total">₱0</span>
                </div>

                <div class="action-row-col action-buttons payment-actions">
                    <button id="reviewPaymentBtn" 
                            class="continue-btn full-btn">
                        Review Payment
                    </button>
                    <a href="make-payment.html" class="back-btn full-btn">Back to Fees</a>
                </div>
            </div>

        </div>

    <script src="../../assets/scripts/settings.js"></script>
    <script src="../../assets/scripts/sample-accounts.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/script.js"></script>
    <script>
    const fees = JSON.parse(
        localStorage.getItem('ccs.selected.fees') || '[]'
    );
    const selectedOrgId = (fees[0] && fees[0].orgId) || (window.CCSAuthHelpers && typeof window.CCSAuthHelpers.getCurrentOrganizationScope === 'function' && window.CCSAuthHelpers.getCurrentOrganizationScope() ? window.CCSAuthHelpers.getCurrentOrganizationScope().orgId : 'u-org-001');
    const summaryEl = document.getElementById(
        'method-summary-items'
    );
    const totalEl = document.getElementById(
        'method-summary-total'
    );
    const paymentAccountsListEl = document.getElementById('paymentAccountsList');
    const paymentAccountsEmptyEl = document.getElementById('paymentAccountsEmpty');
    const total = fees.reduce((s, f) => s + f.price, 0);

    if (fees.length === 0) {
        summaryEl.innerHTML = 
            '<p class="summary-empty">No fees selected.</p>';
    } else {
        summaryEl.innerHTML = fees.map(f =>
            `<div class="summary-item">
                <span>${f.fee}</span>
                <span>&#8369;${f.price}</span>
            </div>`
        ).join('');
        totalEl.textContent = '\u20B1' + total;
    }

    const orgAccounts = window.CCSPaymentAccounts && typeof window.CCSPaymentAccounts.getPaymentAccountsForOrg === 'function'
        ? window.CCSPaymentAccounts.getPaymentAccountsForOrg(selectedOrgId).filter(account => account.isActive !== false)
        : [];
    const orgName = orgAccounts[0] && orgAccounts[0].name ? orgAccounts[0].name : (selectedOrgId === 'org-msa-001' ? 'Muslim Student Association' : 'CCS Student Council');

    function normalizeMethod(account) {
        return String(account.type || '').trim().toLowerCase().replace(/\s+/g, '-');
    }

    function renderPaymentAccounts() {
        if (!paymentAccountsListEl) return;

        if (!orgAccounts.length) {
            paymentAccountsEmptyEl.style.display = '';
            paymentAccountsListEl.innerHTML = '';
            document.getElementById('reviewPaymentBtn').disabled = true;
            return;
        }

        paymentAccountsEmptyEl.style.display = 'none';
        document.getElementById('reviewPaymentBtn').disabled = false;

        paymentAccountsListEl.innerHTML = orgAccounts.map((account, index) => {
            const method = normalizeMethod(account);
            const isRecommended = method === 'gcash' || index === 0;
            return `
                <div class="method-option ${index === 0 ? 'selected' : ''}" data-account-id="${account.id}" data-method="${method}">
                    <div class="method-info">
                        <i class='bx bx-wallet method-icon'></i>
                        <div>
                            <div class="method-name">${account.type}${isRecommended ? ' <span class="badge">Recommended</span>' : ''}</div>
                            <p class="method-desc">${account.name}${account.number ? ` • ${account.number}` : ''}</p>
                        </div>
                    </div>
                    <input type="radio" name="payment-method" value="${method}" ${index === 0 ? 'checked' : ''}>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.method-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.method-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                const radio = option.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;

                const selectedAccount = orgAccounts.find(account => account.id === option.dataset.accountId);
                if (selectedAccount) {
                    localStorage.setItem('ccs.payment.method', normalizeMethod(selectedAccount));
                    localStorage.setItem('ccs.payment.account', JSON.stringify({
                        id: selectedAccount.id,
                        type: selectedAccount.type,
                        name: selectedAccount.name,
                        number: selectedAccount.number || '',
                        orgId: selectedOrgId
                    }));
                }
            });
        });

        const selectedCard = document.querySelector('.method-option.selected') || document.querySelector('.method-option');
        if (selectedCard) {
            const selectedAccount = orgAccounts.find(account => account.id === selectedCard.dataset.accountId) || orgAccounts[0];
            if (selectedAccount) {
                localStorage.setItem('ccs.payment.method', normalizeMethod(selectedAccount));
                localStorage.setItem('ccs.payment.account', JSON.stringify({
                    id: selectedAccount.id,
                    type: selectedAccount.type,
                    name: selectedAccount.name,
                    number: selectedAccount.number || '',
                    orgId: selectedOrgId
                }));
            }
        }
    }

    renderPaymentAccounts();

    document.getElementById('reviewPaymentBtn')
        .addEventListener('click', function() {
        const selected = document.querySelector('.method-option.selected');
        if (selected && selected.dataset.accountId) {
            const selectedAccount = orgAccounts.find(account => account.id === selected.dataset.accountId);
            if (selectedAccount) {
                localStorage.setItem('ccs.payment.method', normalizeMethod(selectedAccount));
                localStorage.setItem('ccs.payment.account', JSON.stringify({
                    id: selectedAccount.id,
                    type: selectedAccount.type,
                    name: selectedAccount.name,
                    number: selectedAccount.number || '',
                    orgId: selectedOrgId
                }));
            }
        }

        window.location.href = 'payment-confirmation.html';
    });

</script>
    </body>
</html>
