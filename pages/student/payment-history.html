<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <title> CCS PAY++ - Payment History </title>
        <link rel="stylesheet" href="../../styles/student-styles/payment-process.css">
        <link rel="stylesheet" href="../../styles/sidebar.css">
        <link rel="stylesheet" href="../../styles/student-styles/payment-history.css">
        <!-- Boxicons CDN Link -->
        <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="../../styles/settings.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .payment-history-tabs {
                display: flex;
                gap: 0;
                border-bottom: 2px solid var(--sys-border);
                background: white;
                padding: 0 20px;
                margin-bottom: 20px;
                border-radius: 0;
            }

            .payment-history-tab-btn {
                background: none;
                border: none;
                padding: 14px 18px;
                font-size: 14px;
                font-weight: 600;
                color: var(--sys-text-500);
                cursor: pointer;
                border-bottom: 3px solid transparent;
                transition: all 0.2s ease;
                font-family: 'Poppins', sans-serif;
            }

            .payment-history-tab-btn:hover {
                color: var(--sys-text-900);
                background: rgba(var(--brand-rgb), 0.04);
            }

            .payment-history-tab-btn.active {
                color: var(--color-primary);
                border-bottom-color: var(--color-primary);
            }

            .payment-history-tab-content {
                display: none;
            }

            .payment-history-tab-content.active {
                display: block;
            }

            .promissory-table-wrapper {
                width: 100%;
                border-radius: 12px;
                overflow: hidden;
                border: 2px solid var(--sys-border);
                background: white;
                margin-bottom: 12px;
            }

            .promissory-table {
                width: 100%;
                border-collapse: collapse;
                font-family: 'Poppins', sans-serif;
            }

            .promissory-table thead {
                background: var(--sys-surface-muted);
                border-bottom: 2px solid var(--sys-border);
            }

            .promissory-table th {
                padding: 12px 16px;
                text-align: left;
                font-size: 11px;
                font-weight: 700;
                color: var(--sys-text-500);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .promissory-table tbody tr {
                border-bottom: 1px solid var(--sys-border);
                transition: background-color 0.2s ease;
            }

            .promissory-table tbody tr:hover {
                background-color: rgba(var(--brand-rgb), 0.04);
            }

            .promissory-table td {
                padding: 14px 16px;
                font-size: 13px;
                color: var(--sys-text-900);
                vertical-align: middle;
            }

            .promissory-fee-name {
                font-weight: 600;
                color: var(--color-primary);
            }

            .promissory-amount {
                font-weight: 700;
                font-size: 14px;
            }

            .promissory-date {
                color: var(--sys-text-500);
                font-size: 12px;
            }

            .promissory-status-badge {
                display: inline-block;
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 11px;
                font-weight: 600;
                text-align: center;
                min-width: 80px;
            }

            .promissory-status-pending {
                background: #fef3c7;
                color: #92400e;
            }

            .promissory-status-approved {
                background: #d1fae5;
                color: #065f46;
            }

            .promissory-status-rejected {
                background: #fee2e2;
                color: #991b1b;
            }

            .promissory-reason {
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <nav class="navbar page-header payment-header">
            <a href="student-dashboard.html" class="back-arrow"><i class="bx bx-arrow-back"></i></a>
            <div class="nav-title">
                <h2>Payment History</h2>
                <p>View all your receipts and transactions</p>
            </div>
        </nav>

        <div class="receipt-container">
            <!-- Tab Navigation -->
            <div class="payment-history-tabs">
                <button class="payment-history-tab-btn active" data-tab="recent-payments">
                    <i class='bx bx-history'></i> Recent Payments
                </button>
                <button class="payment-history-tab-btn" data-tab="pending-payments">
                    <i class='bx bx-time'></i> Pending Payments
                </button>
                <button class="payment-history-tab-btn" data-tab="promissory-notes">
                    <i class='bx bx-note'></i> Promissory Notes
                </button>
            </div>

            <!-- Tab Content: Recent Payments -->
            <div class="payment-history-tab-content active" id="recent-payments-content">
                <div class="table-header">
                    <div>
                        <h2>Recent Payments</h2>
                        <p style="color: var(--sys-text-500); font-size: 13px; margin-top: 4px;">Your payment activity from the last 30 days</p>
                    </div>
                </div>
                <div class="table-container" id="recent-payments-table"></div>
            </div>

            <!-- Tab Content: Pending Payments -->
            <div class="payment-history-tab-content" id="pending-payments-content">
                <div class="table-header">
                    <div>
                        <h2>Pending Payments</h2>
                        <p style="color: var(--sys-text-500); font-size: 13px; margin-top: 4px;">Payments awaiting verification</p>
                    </div>
                </div>
                <div class="table-container" id="pending-payments-table"></div>
            </div>

            <!-- Tab Content: Promissory Notes -->
            <div class="payment-history-tab-content" id="promissory-notes-content">
                <div class="table-header">
                    <div>
                        <h2>Promissory Notes</h2>
                        <p style="color: var(--sys-text-500); font-size: 13px; margin-top: 4px;">Your promissory note requests and status</p>
                    </div>
                </div>
                <div class="table-container" id="promissory-notes-table"></div>
            </div>

            <!-- Receipt Detail Modal -->
            <div class="receipt-modal-overlay" id="receipt-modal" onclick="if(event.target === this) PaymentHistory.closeModal()">
                <div class="receipt-modal-card">
                    <div class="receipt-modal-header">
                        <h3 id="modal-title">Receipt Details</h3>
                        <button class="receipt-modal-close" onclick="PaymentHistory.closeModal()">
                            <i class='bx bx-x'></i>
                        </button>
                    </div>
                    <div class="receipt-modal-content" id="receipt-modal-content"></div>
                    <div class="receipt-modal-actions">
                        <button class="receipt-modal-btn" onclick="PaymentHistory.downloadReceipt()">
                            <i class='bx bx-download'></i> Download PDF
                        </button>
                        <button class="receipt-modal-btn-close" onclick="PaymentHistory.closeModal()">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>

    <script src="../../assets/scripts/settings.js"></script>
    <script src="../../assets/scripts/sample-accounts.js"></script>
    <script src="../../assets/scripts/auth.js"></script>
    <script src="../../assets/scripts/script.js"></script>
    <script>
        const FEES_STORAGE_KEY = 'ccs.organization.fees';
        const PROMISSORY_STORAGE_KEY = 'ccs.promissory.requests';

        // Tab switching functionality
        document.querySelectorAll('.payment-history-tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                
                // Remove active class from all buttons and contents
                document.querySelectorAll('.payment-history-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.payment-history-tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked button and corresponding content
                this.classList.add('active');
                document.getElementById(tabName + '-content').classList.add('active');
                
                // Render the appropriate content
                if (tabName === 'recent-payments') {
                    PaymentHistory.renderRecentPayments();
                } else if (tabName === 'pending-payments') {
                    PaymentHistory.renderPendingPayments();
                } else if (tabName === 'promissory-notes') {
                    PromissoryNotesTab.render();
                }
            });
        });

        // Payment History Module for receipt tabs
        const PaymentHistory = (() => {
            let paymentHistory = [];
            let currentReceiptList = [];
            let currentModal = null;

            function initializeFromDashboard() {
                let currentUser = null;

                if (window.Auth && typeof window.Auth.getUser === 'function') {
                    currentUser = window.Auth.getUser();
                }

                if (!currentUser) {
                    try {
                        const authData = localStorage.getItem('ccs.auth.user') || sessionStorage.getItem('ccs.auth.user');
                        if (authData) {
                            currentUser = JSON.parse(authData);
                        }
                    } catch (e) {
                        console.warn('Could not parse auth data:', e);
                    }
                }

                const paymentStore = window.CCSPaymentStore && typeof window.CCSPaymentStore.getPaymentsForStudent === 'function'
                    ? window.CCSPaymentStore
                    : null;

                if (!paymentStore) {
                    console.warn('CCSPaymentStore not loaded');
                    paymentHistory = [];
                    return;
                }

                const studentPayments = currentUser && currentUser.studentId
                    ? paymentStore.getPaymentsForStudent(currentUser.studentId)
                    : paymentStore.getPayments();

                paymentHistory = studentPayments.map(function (payment) {
                    return {
                        desc: payment.feeName || payment.desc || 'Payment',
                        date: payment.dateSubmitted || payment.date || '',
                        amount: payment.amount,
                        method: payment.paymentMethod || payment.method || 'Cash',
                        referenceNumber: payment.referenceNumber || '',
                        orgName: payment.orgName || (payment.orgId === 'org-msa-001' ? 'Muslim Student Association' : 'CCS Student Council'),
                        status: payment.status || 'Confirmed',
                        rejectionReason: payment.rejectionReason || ''
                    };
                });
            }

            function formatDate(date) {
                const d = new Date(date + 'T00:00:00');
                return d.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            function isRecent(dateStr) {
                const now = new Date();
                const d = new Date(dateStr + 'T00:00:00');
                const diffTime = now - d;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays <= 30;
            }

            function buildTable(payments) {
                if (payments.length === 0) {
                    currentReceiptList = [];
                    return '<p class="summary-empty" style="padding: 20px; text-align: center;">No receipts found</p>';
                }

                const sortedPayments = payments.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
                currentReceiptList = sortedPayments;

                let html = `
                    <div class="receipt-table-wrapper">
                        <table class="receipt-history-table">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                sortedPayments.forEach((payment, idx) => {
                    const status = String(payment.status || 'Confirmed').toLowerCase();
                    const statusBadge = status === 'pending verification'
                        ? '<span class="receipt-status-badge receipt-status-badge--pending">Pending Verification</span>'
                        : status === 'rejected'
                            ? '<span class="receipt-status-badge receipt-status-badge--rejected">Rejected</span>'
                            : '<span class="receipt-status-badge">Confirmed</span>';
                    const referenceBlock = payment.referenceNumber ? `<div class="receipt-date">Ref: ${payment.referenceNumber}</div>` : '';
                    html += `
                        <tr>
                            <td><span class="receipt-num">${payment.desc}</span>${referenceBlock}${payment.orgName ? `<div class="receipt-date">${payment.orgName}</div>` : ''}</td>
                            <td><span class="receipt-date">${payment.date}</span></td>
                            <td><span class="receipt-amount">${payment.amount}</span></td>
                            <td class="receipt-action-cell">
                                ${statusBadge}
                                <button class="btn-view-details" onclick="PaymentHistory.viewDetails(${idx})">
                                    <i class='bx bx-show'></i> View
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                return html;
            }

            function renderPayments(filter) {
                const now = new Date();
                const recentThreshold = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

                const filtered = paymentHistory.filter(function (payment) {
                    const paymentDate = payment.date || '';
                    const dateObj = new Date(paymentDate + 'T00:00:00');
                    const status = String(payment.status || 'Confirmed').toLowerCase();

                    if (filter === 'pending') {
                        return status === 'pending verification';
                    }

                    if (status !== 'confirmed') {
                        return false;
                    }

                    if (filter === 'recent') return dateObj >= recentThreshold;
                    if (filter === 'old') return dateObj < recentThreshold;
                    return true;
                });

                return buildTable(filtered);
            }

            function viewDetails(index) {
                const payment = currentReceiptList[index] || paymentHistory[index];
                if (!payment) return;

                currentModal = payment;

                const dateObj = new Date(payment.date + 'T00:00:00');
                const amountStr = payment.amount.replace('₱', '').replace(/,/g, '');
                const amount = parseInt(amountStr);
                const receiptId = `WMSU-FO-${dateObj.getFullYear()}-${String(index + 1000).slice(-6)}`;
                const method = String(payment.method || payment.paymentMethod || 'Cash');
                const transactionId = `${method.toUpperCase().slice(0, 3)}-${dateObj.toISOString().slice(0, 10).replace(/-/g, '')}-${String(index).padStart(6, '0')}`;

                const contentHtml = `
                    <div class="receipt-modal-header-section">
                        <div class="receipt-modal-row">
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Receipt Number</span>
                                <span class="receipt-modal-value">${receiptId}</span>
                            </div>
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Date</span>
                                <span class="receipt-modal-value">${payment.date}</span>
                            </div>
                        </div>
                    </div>

                    <div class="receipt-modal-divider"></div>

                    <div class="receipt-modal-section">
                        <h4 class="receipt-modal-section-title">Payment Information</h4>
                        <div class="receipt-modal-row">
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Payment Method</span>
                                <span class="receipt-modal-value">${method}</span>
                            </div>
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Transaction ID</span>
                                <span class="receipt-modal-value receipt-txn-id">${transactionId}</span>
                            </div>
                        </div>
                        <div class="receipt-modal-row">
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Status</span>
                                <span class="receipt-modal-value">${payment.status && String(payment.status).toLowerCase() === 'pending verification'
                            ? '<span class="receipt-status-badge receipt-status-badge--pending">Pending Verification</span>'
                            : String(payment.status || '').toLowerCase() === 'rejected'
                                ? '<span class="receipt-status-badge receipt-status-badge--rejected">Rejected</span>'
                                : '<span class="receipt-status-badge">Confirmed</span>'}</span>
                            </div>
                            <div class="receipt-modal-item">
                                <span class="receipt-modal-label">Processed By</span>
                                <span class="receipt-modal-value">Finance Office</span>
                            </div>
                        </div>
                    </div>

                    <div class="receipt-modal-divider"></div>

                    <div class="receipt-modal-section">
                        <h4 class="receipt-modal-section-title">Fee Breakdown</h4>
                        <div class="receipt-fee-list">
                            <div class="receipt-fee-item">
                                <span class="receipt-fee-name">${payment.desc}</span>
                                <span class="receipt-fee-amt">${payment.amount}</span>
                            </div>
                            <div class="receipt-fee-total">
                                <span>Total Amount Paid</span>
                                <span>${payment.amount}</span>
                            </div>
                        </div>
                    </div>

                    <div class="receipt-modal-divider"></div>

                    <div class="receipt-modal-section">
                        <h4 class="receipt-modal-section-title">Receipt Authenticity</h4>
                        <div class="receipt-security-info">
                            <div class="receipt-verified-badge">
                                <i class='bx bx-shield-check'></i>
                                <span>Verified &amp; Approved</span>
                            </div>
                            <p class="receipt-security-text">This receipt has been digitally verified and authenticated by the Finance Office.</p>
                            <div class="receipt-verification-items">
                                <div class="receipt-verification-item">
                                    <i class='bx bx-check-circle'></i>
                                    <span>Digital signature verified</span>
                                </div>
                                <div class="receipt-verification-item">
                                    <i class='bx bx-check-circle'></i>
                                    <span>Payment gateway confirmed</span>
                                </div>
                                <div class="receipt-verification-item">
                                    <i class='bx bx-check-circle'></i>
                                    <span>Student record verified</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="receipt-modal-divider"></div>

                    <div class="receipt-security-notice">
                        <i class='bx bx-info-circle'></i>
                        <p>This is an official electronic receipt. Contact the Finance Office for inquiries.</p>
                    </div>
                `;

                document.getElementById('modal-title').textContent = `Receipt ${receiptId}`;
                document.getElementById('receipt-modal-content').innerHTML = contentHtml;
                document.getElementById('receipt-modal').classList.add('show');
            }

            function closeModal() {
                document.getElementById('receipt-modal').classList.remove('show');
                currentModal = null;
            }

            function downloadReceipt() {
                if (currentModal) {
                    window.print();
                }
            }

            function renderRecentPayments() {
                const container = document.getElementById('recent-payments-table');
                container.innerHTML = renderPayments('recent');
            }

            function renderPendingPayments() {
                const container = document.getElementById('pending-payments-table');
                container.innerHTML = renderPayments('pending');
            }

            function initializePage() {
                initializeFromDashboard();
                renderRecentPayments();
            }

            return {
                init: initializePage,
                viewDetails: viewDetails,
                closeModal: closeModal,
                downloadReceipt: downloadReceipt,
                renderRecentPayments: renderRecentPayments,
                renderPendingPayments: renderPendingPayments
            };
        })();

        // Promissory Notes Tab Module
        const PromissoryNotesTab = (() => {
            function getStudentId() {
                let user = null;
                if (window.Auth && typeof window.Auth.getUser === 'function') {
                    user = window.Auth.getUser();
                }
                if (!user) {
                    try {
                        const authData = localStorage.getItem('ccs.auth.user') || sessionStorage.getItem('ccs.auth.user');
                        if (authData) {
                            user = JSON.parse(authData);
                        }
                    } catch (e) {
                        console.warn('Could not parse auth data:', e);
                    }
                }
                return user && user.studentId ? user.studentId : null;
            }

            function getStudentReligion() {
                let user = null;
                if (window.Auth && typeof window.Auth.getUser === 'function') {
                    user = window.Auth.getUser();
                }
                if (!user) {
                    try {
                        const authData = localStorage.getItem('ccs.auth.user') || sessionStorage.getItem('ccs.auth.user');
                        if (authData) {
                            user = JSON.parse(authData);
                        }
                    } catch (e) {
                        console.warn('Could not parse auth data:', e);
                    }
                }
                return user && user.religion ? user.religion : '';
            }

            function normalizeReligion(value) {
                return String(value || '').trim().toLowerCase();
            }

            function isMsaFee(feeName) {
                return feeName && feeName.toLowerCase().includes('msa');
            }

            function shouldShowPromissory(request) {
                // Check if this is an MSA fee
                if (isMsaFee(request.feeName)) {
                    // Only show MSA fees to Muslim/Islam students
                    const studentReligion = normalizeReligion(getStudentReligion());
                    return studentReligion === 'muslim' || studentReligion === 'muslim/islam';
                }
                return true;
            }

            function getPromissoryNotes() {
                const studentId = getStudentId();
                if (!studentId) return [];

                try {
                    const stored = localStorage.getItem(PROMISSORY_STORAGE_KEY);
                    const requests = stored ? JSON.parse(stored) : [];
                    
                    return requests
                        .filter(req => req.studentId === studentId)
                        .filter(req => shouldShowPromissory(req))
                        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                } catch (e) {
                    console.warn('Could not parse promissory notes:', e);
                    return [];
                }
            }

            function getStatusBadgeClass(status) {
                const normalizedStatus = String(status || '').toLowerCase();
                if (normalizedStatus === 'pending review') {
                    return 'promissory-status-pending';
                } else if (normalizedStatus === 'promissory approved') {
                    return 'promissory-status-approved';
                } else if (normalizedStatus === 'promissory rejected') {
                    return 'promissory-status-rejected';
                }
                return 'promissory-status-pending';
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                try {
                    const d = new Date(dateStr + 'T00:00:00');
                    return d.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                } catch (e) {
                    return dateStr;
                }
            }

            function formatCurrency(amount) {
                return '₱' + Number(amount || 0).toFixed(2);
            }

            function render() {
                const notes = getPromissoryNotes();
                const container = document.getElementById('promissory-notes-table');

                if (notes.length === 0) {
                    container.innerHTML = '<p class="summary-empty" style="padding: 20px; text-align: center;">No promissory note requests</p>';
                    return;
                }

                let html = `
                    <div class="promissory-table-wrapper">
                        <table class="promissory-table">
                            <thead>
                                <tr>
                                    <th>Fee Name</th>
                                    <th>Amount</th>
                                    <th>Date Requested</th>
                                    <th>Reason</th>
                                    <th>Promised Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                notes.forEach(note => {
                    const statusClass = getStatusBadgeClass(note.status);
                    const amount = note.partialAmount ? formatCurrency(note.partialAmount) : (function(){
                        // try to lookup fee amount in stored fees
                        try {
                            const fees = JSON.parse(localStorage.getItem(FEES_STORAGE_KEY) || '[]');
                            const found = fees.find(f => String(f.id || '') === String(note.feeId || '')) || fees.find(f => String(f.name || '').toLowerCase() === String(note.feeName || '').toLowerCase());
                            return found ? formatCurrency(found.amount) : 'Full Payment';
                        } catch (e) { return 'Full Payment'; }
                    })();

                    html += `
                        <tr>
                            <td><span class="promissory-fee-name">${note.feeName}</span></td>
                            <td><span class="promissory-amount">${amount}</span></td>
                            <td><span class="promissory-date">${formatDate(note.createdAt)}</span></td>
                            <td><span class="promissory-reason" title="${note.reason}">${note.reason}</span></td>
                            <td><span class="promissory-date">${formatDate(note.promisedDate)}</span></td>
                            <td><span class="promissory-status-badge ${statusClass}">${note.status}</span></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                container.innerHTML = html;
            }

            return {
                render: render
            };
        })();

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                PaymentHistory.init();
            }, 200);
        });

        // Clear fees from storage after rendering
        localStorage.removeItem('ccs.selected.fees');
        localStorage.removeItem('ccs.payment.method');
    </script>
    </body>
</html>
